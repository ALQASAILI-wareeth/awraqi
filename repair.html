<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10264b"><title>إصلاح تحميل أوراقي</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#10264b;color:#f5f8ff;font:18px/1.8 -apple-system,'Geeza Pro',sans-serif;display:grid;place-items:center;padding:24px}.card{width:100%;max-width:460px;padding:28px;background:#193b68;border:1px solid #cfb77d;border-radius:24px}h1{font-size:26px;color:#f1d99f}p{color:#d6e3f5;font-size:16px}button{width:100%;font:700 18px/1.8 inherit;background:#e4c582;color:#10264b;border:0;border-radius:16px;padding:15px;box-shadow:0 5px #997339}#state{font-size:14px}</style><main class="card"><h1>إصلاح تحميل أوراقي</h1><p>يُحدّث ملفات تشغيل التطبيق المؤقتة. لا يحذف المستندات أو قاعدة بيانات أوراقي.</p><button id="fix">إصلاح التحميل وفتح التطبيق</button><p id="state" role="status"></p></main><script>
document.getElementById('fix').onclick=async()=>{const state=document.getElementById('state'),button=document.getElementById('fix');if(!/^https?:$/.test(location.protocol)){state.textContent='افتح هذه الصفحة من موقع أوراقي بعد رفع ملفات التحديث.';return}button.disabled=true;state.textContent='جارٍ تحديث ملفات التشغيل المؤقتة…';try{const scope=new URL('./',location.href).href;if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();for(const reg of regs)if(reg.scope===scope)await reg.unregister()}if('caches'in window){const names=await caches.keys();for(const name of names)if(name.startsWith('awraqi-'))await caches.delete(name)}state.textContent='اكتمل الإصلاح. جارٍ فتح أوراقي…';location.replace(new URL('./?recovery=451',location.href).href)}catch(e){button.disabled=false;state.textContent='تعذّر تحديث الملفات المؤقتة. أغلق الصفحة وافتح التطبيق مجدداً.'}};
</script></html>
