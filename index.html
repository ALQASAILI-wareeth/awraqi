/* =====================================================================
   READING ENGINE
   Layers of verification (nothing is "guessed" silently):
   1. Embedded text layer of PDFs (exact characters, no OCR error)
   2. MRZ check digits (ICAO 9303) for passports / ID cards
   3. Luhn check for UAE Emirates ID numbers
   4. Two independent AI readings (different models) compared letter by letter
   5. Fuzzy (Levenshtein) match of the name against the embedded text
   The result is "مؤكد" only if letter-exact agreement exists; otherwise the
   user must review. Without an API key only layers 1-3 run.
   ===================================================================== */
const DIAC=/[\u064B-\u065F\u0670\u0640\u06D6-\u06ED]/g;
const digitsFix=s=>String(s).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d));

const nLoose=s=>nStrict(s).replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/ؤ/g,"و").replace(/ئ/g,"ي").replace(/[^\p{L}\p{N} ]/gu,"").replace(/\s+/g," ").trim();

  const ns=nStrict(name),nl=nLoose(name);if(!ns||!pages.length)return null;
  const k=ns.split(" ").length;let best=null;
  for(const pg of pages){
    const base=String(pg).normalize("NFKC"),rev=base.split(/\n/).map(l=>[...l].reverse().join("")).join("\n");
    for(const txt of [base,rev]){
      const toks=txt.replace(DIAC,"").split(/\s+/).filter(Boolean);
      for(let w=Math.max(1,k-1);w<=k+1;w++)for(let i=0;i+w<=toks.length;i++){
        const win=toks.slice(i,i+w).join(" ");
        if(nStrict(win)===ns)return{kind:"exact",match:win,dist:0};
        const wl=nLoose(win);
        if(wl===nl){if(!best||best.dist>.5)best={kind:"loose",match:win,dist:.5}}
        else if(Math.abs(wl.length-nl.length)<=3){const d=lev(wl,nl,2);if(d<=2&&(!best||d<best.dist))best={kind:"near",match:win,dist:d}}
      }

  }

function parseDateStr(s){

/* minimal ZIP reader: central directory + stored/deflate entries, streamed from the file (no full load in memory) */
async function readZip(file,opts={}){
  const u16=(d,o)=>d.getUint16(o,true),u32=(d,o)=>d.getUint32(o,true),u64=(d,o)=>Number(d.getBigUint64(o,true));
  const tailLen=Math.min(file.size,65557+22),tailStart=file.size-tailLen,tail=new DataView(await file.slice(tailStart).arrayBuffer());
  let e=-1;for(let i=tailLen-22;i>=0;i--){if(u32(tail,i)===0x06054b50){e=i;break}}
  if(e<0)throw new Error("notzip");
  let n=u16(tail,e+10),cdSize=u32(tail,e+12),cdOff=u32(tail,e+16);
  if(n===0xFFFF||cdOff===0xFFFFFFFF||cdSize===0xFFFFFFFF){
    /* ZIP64: locator sits right before the end-of-central-directory record */
    let loc=null;
    if(e>=20&&u32(tail,e-20)===0x07064b50)loc=new DataView(tail.buffer,e-20,20);
    else{const lo=tailStart+e-20;if(lo>=0)loc=new DataView(await file.slice(lo,lo+20).arrayBuffer());}
    if(!loc||u32(loc,0)!==0x07064b50)throw new Error("zip64");
    const off64=u64(loc,8),r=new DataView(await file.slice(off64,off64+56).arrayBuffer());
    if(r.byteLength<56||u32(r,0)!==0x06064b50)throw new Error("zip64");
    n=u64(r,32);cdSize=u64(r,40);cdOff=u64(r,48);
  }
  const cd=new DataView(await file.slice(cdOff,cdOff+cdSize).arrayBuffer()),cdb=new Uint8Array(cd.buffer);
  const out={files:[],saved:0,skipped:0,encrypted:0,details:[]};let p=0;
  for(let k=0;k<n&&p+46<=cd.byteLength;k++){
    if(u32(cd,p)!==0x02014b50)throw new Error("notzip");
    const flags=u16(cd,p+8),method=u16(cd,p+10),nl=u16(cd,p+28),el=u16(cd,p+30),cl=u16(cd,p+32);
    let csz=u32(cd,p+20),usz=u32(cd,p+24),lho=u32(cd,p+42);
    if(usz===0xFFFFFFFF||csz===0xFFFFFFFF||lho===0xFFFFFFFF){
      let q=p+46+nl;const end=q+el;
      while(q+4<=end){const id=u16(cd,q),sz=u16(cd,q+2);if(id===1){let r=q+4;if(usz===0xFFFFFFFF){usz=u64(cd,r);r+=8}if(csz===0xFFFFFFFF){csz=u64(cd,r);r+=8}if(lho===0xFFFFFFFF){lho=u64(cd,r);r+=8}break}q+=4+sz}
    }
    let name;try{name=new TextDecoder("utf-8",{fatal:true}).decode(cdb.subarray(p+46,p+46+nl))}catch(_){name=new TextDecoder("windows-1252").decode(cdb.subarray(p+46,p+46+nl))}
    p+=46+nl+el+cl;
    const base=name.split("/").pop(),ext=(base.split(".").pop()||"").toLowerCase();
    if(!base||name.endsWith("/"))continue;
    if(opts.only&&!opts.only.test(name))continue;
    if(flags&1){out.encrypted++;out.details.push({name:base,reason:"محمي بكلمة مرور"});continue}
    if(method!==0&&method!==8){out.skipped++;out.details.push({name:base,reason:"طريقة ضغط غير مدعومة؛ فك الضغط أولاً"});continue}
    const lh=new DataView(await file.slice(lho,lho+30).arrayBuffer());
    if(u32(lh,0)!==0x04034b50)throw new Error("notzip");
    const start=lho+30+u16(lh,26)+u16(lh,28);let blob=file.slice(start,start+csz);
    if(opts.saveStream){
      try{let stream=blob.stream();if(method===8){if(typeof DecompressionStream==='undefined')throw new Error('nodecomp');stream=stream.pipeThrough(new DecompressionStream('deflate-raw'))}
       await opts.saveStream({name:base,archivePath:name,size:usz,type:EXTMIME[ext]||'application/octet-stream'},stream);out.saved++;
      }catch(e){out.details.push({name:base,reason:'تعذّر حفظ هذا العنصر؛ أُدرج الأرشيف الأصلي للحفظ'})}
      continue;
    }
    if(method===8){
      if(typeof DecompressionStream==="undefined")throw new Error("nodecomp");
      blob=await new Response(blob.stream().pipeThrough(new DecompressionStream("deflate-raw"))).blob();
    }
    const entry=new File([blob],base,{type:EXTMIME[ext]||"application/octet-stream"});entry.archivePath=name;out.files.push(entry);
  }
  return out;
}

async function safeAnalyze(blob,pdf){
  if(isExcel(blob))return excelLocalInfo(blob);
  if(!isPdf(blob)&&!isImg(blob))return generalFileInfo(blob);
  if(blob.size>8*1048576)return generalFileInfo(blob);
  const useAI=!!getKey();
  const steps=useAI?["قراءة صفحات الملف","القراءة الأولى (Claude)","قراءة ثانية مستقلة للتأكد","مطابقة الأسماء وفحص الأرقام"]:["قراءة نص الملف وفحص الأرقام"];
  let aborter=new AbortController();curAbort=aborter;
  const draw=i=>{sheet(`<h3>جارٍ فحص المستند…</h3><ul class="stp">${steps.map((s,k)=>`<li class="${k<i?"done":k===i?"on":""}">${k<i?ico("check",16):k===i?'<span class="sp" style="width:16px;height:16px;border-width:2px"></span>':"○"} ${s}</li>`).join("")}</ul><p class="m">يفحص كل صفحات المستند. لا يُعتمد أي اسم دون تأكيد.</p><div class="row2"><button class="btn s" id="cx">تخطي الفحص</button></div>`,true);$("cx").onclick=()=>aborter.abort()};
  draw(0);
  try{return await analyze(blob,pdf,{signal:aborter.signal,onStep:i=>draw(Math.min(i,steps.length-1))})}
  catch(e){
    let msg="";
    if(e.name==="AbortError")msg="تم تخطي الفحص الذكي. اكتب العنوان بنفسك أو راجع القراءة المحلية";
    else if(e.message==="key")msg="مفتاح القراءة الذكية غير صحيح. عدّله من الإعدادات.";
    else if(e.message==="nokey")msg="";
    else msg=(navigator.onLine===false?"لا يوجد اتصال بالإنترنت.":"تعذّر إكمال القراءة الذكية.")+" استُخدم الفحص المحلي فقط.";
    if(msg)toast(msg,{err:e.name!=="AbortError",ms:5000});
    try{return await analyze(blob,pdf,{noai:true})}
    catch(e2){return{type:"other",label:"",name:"",cands:[],good:[],warn:["تعذّر فحص هذا الملف؛ قد يكون تالفاً. تأكد أنه يفتح قبل الحفظ."],level:"none",title:"",cat:null,exp:"",summary:""}}
  }
}

async function nextFile(){

async function saveDoc(f,o){
 const meta=incomingMeta(f,o);await put(meta,f.slice(0,f.size,meta.mime));await verifySaved(meta.id,true);
 // Save first. Preview work is bounded, optional and never runs for large files.
 if(f.size<=3*1048576&&['img','pdf','excel'].includes(meta.type)){
  try{meta.thumb=meta.type==='excel'?await excelThumbnail(f):await makeThumb(f,meta.type==='pdf');await put(meta)}catch(e){}
 }
 return meta.id;
}

// Decode only visible thumbnails, one at a time; never scan the library at startup.
const thumbQueue=[];let thumbRunning=false;const thumbAttempts=new Set();
function observeFileThumbs(root){
 const observer=new IntersectionObserver(entries=>{for(const entry of entries)if(entry.isIntersecting){observer.unobserve(entry.target);thumbQueue.push(entry.target);drainFileThumbs()}},{rootMargin:'80px'});
 root.querySelectorAll('[data-o]').forEach(el=>observer.observe(el));
 setTimeout(()=>observer.disconnect(),60000);
}
async function drainFileThumbs(){
 if(thumbRunning)return;thumbRunning=true;
 try{while(thumbQueue.length){const el=thumbQueue.shift();if(!el.isConnected)continue;const d=docs.find(d=>d.id===el.dataset.o);if(!d||isAppleSidecar(d)||(d.previewThumb&&(d.type!=='video'||d.videoThumbVersion===2))||thumbAttempts.has(d.id)||!['img','pdf','video'].includes(d.type))continue;
 // Large originals stay available without starting expensive background decoding.
 if(d.type!=='video'&&d.size>12*1048576)continue;
 thumbAttempts.add(d.id);
 try{const blob=await getBlob(d.id);if(!el.isConnected)continue;let thumb;
 if(d.type==='video')thumb=await videoThumbnail(blob);else{const c=await pageCanvas(blob,d.type==='pdf',360);thumb=c.toDataURL('image/jpeg',.8);c.width=c.height=1;}
 if(!thumb)continue;const current=await req(store('meta').get(d.id));if(!current||current.del)continue;const updated={...current,thumb,previewThumb:true,...(d.type==='video'?{videoThumbVersion:2}:{})};await put(updated);Object.assign(d,updated);
 document.querySelectorAll('[data-o]').forEach(node=>{if(node.dataset.o!==d.id)return;const th=node.querySelector('.th');if(th){th.innerHTML='';const im=new Image();im.src=thumb;im.alt=d.title;th.appendChild(im)}});
 }catch(e){}

async function readBackup(file){
  if((await file.slice(0,4).text())!=="AWQ1")throw new Error("fmt");
  let pos=4;const out=[];
  while(pos<file.size){
    const ml=new DataView(await file.slice(pos,pos+4).arrayBuffer()).getUint32(0);pos+=4;
    const meta=JSON.parse(await file.slice(pos,pos+ml).text());pos+=ml;
    const bl=Number(new DataView(await file.slice(pos,pos+8).arrayBuffer()).getBigUint64(0));pos+=8;
    if(pos+bl>file.size)throw new Error("trunc");
    out.push({meta,blob:file.slice(pos,pos+bl,meta.mime||(meta.type==="pdf"?"application/pdf":"image/jpeg"))});pos+=bl;
  }
  return out;
}

 if(!name||name.length>60)throw new Error('اكتب اسمًا من حرف إلى ستين حرفًا');

 const aliases=Object.assign(Object.create(null),categoryAliases);if(oldName&&oldName!==name)aliases[oldName]=name;
 // Renaming back to an earlier name must not form an alias cycle.
 delete aliases[name];for(const k of Object.keys(aliases))if(aliases[k]===oldName)aliases[k]=name;
 const metadata=await req(store('meta').getAll());
 await new Promise((ok,no)=>{const tx=db.transaction(['meta','files'],'readwrite');for(const d of metadata)if(oldName&&d.cat===oldName)tx.objectStore('meta').put({...d,cat:name});tx.objectStore('files').put({id:CATEGORY_CONFIG_ID,catalog,aliases});tx.oncomplete=ok;tx.onerror=tx.onabort=()=>no(tx.error||new Error('تعذّر حفظ البطاقة'))});

}

  const worker=new Worker('./xlsx-worker.js'),timer=setTimeout(()=>{worker.terminate();reject(new Error('انتهت مهلة قراءة الملف. يمكنك تنزيل الأصل.'))},30000);
  const done=()=>{clearTimeout(timer);worker.terminate()};worker.onmessage=e=>{done();e.data.error?reject(new Error(e.data.error)):resolve(e.data)};worker.onerror=()=>{done();reject(new Error('تعذّر تشغيل عارض Excel. تأكد من رفع ملفات التحديث كاملة.'))};worker.postMessage(data,[data]);

function excelCanvas(sheet,width=1400){
 const rows=sheet.rows.slice(0,23),cols=Math.min(8,Math.max(1,sheet.columns)),rowH=44,headH=120,height=Math.max(400,headH+(rows.length+1)*rowH+70),c=document.createElement('canvas');c.width=width;c.height=Math.round(height*width/1400);const x=c.getContext('2d');x.scale(width/1400,width/1400);x.fillStyle='#f8fafb';x.fillRect(0,0,1400,height);x.fillStyle='#155c49';x.fillRect(0,0,1400,95);x.fillStyle='#fff';x.direction='rtl';x.textAlign='right';x.font='bold 32px sans-serif';x.fillText(sheet.name,1364,55,1250);
 const cw=1328/cols,left=36;for(let j=0;j<cols;j++){x.fillStyle='#e1eae6';x.fillRect(left+j*cw,headH,cw,rowH);x.fillStyle='#34554c';x.textAlign='center';x.font='bold 19px sans-serif';x.fillText(excelColumn(sheet.startColumn+j),left+(j+.5)*cw,headH+29)}
 rows.forEach((r,i)=>{for(let j=0;j<cols;j++){const y=headH+(i+1)*rowH,xx=left+j*cw;x.fillStyle=i%2?'#f0f5f3':'#fff';x.fillRect(xx,y,cw,rowH);x.strokeStyle='#d7e2dd';x.strokeRect(xx,y,cw,rowH);x.save();x.beginPath();x.rect(xx+6,y+2,cw-12,rowH-4);x.clip();x.fillStyle='#162f29';x.font=(i===0?'bold ':'')+'20px sans-serif';x.textAlign='center';const text=String(r[j]??'');x.direction=/[\u0600-\u06ff]/.test(text)?'rtl':'ltr';x.fillText(text.slice(0,60),xx+cw/2,y+29);x.restore()}});
 x.direction='rtl';x.textAlign='right';x.fillStyle='#61716d';x.font='20px sans-serif';x.fillText('معاينة الورقة · اضغط «جدول» لعرض الصفوف والبحث · الملف الأصلي محفوظ',1364,height-24);return c;
}

 const d=viewerCurrent();if(!excelDoc(d))return;const tok=++excelOpenToken;clearViewerTimers();$('excel-pane').hidden=false;$('excel-title').textContent=d.title;$('excel-content').innerHTML='<p class="empty">جارٍ قراءة الجدول…</p>';$('excel-tabs').innerHTML='';$('excel-search').value='';$('excel-status').textContent='';$('excel-error').textContent='';$('excel-original').onclick=()=>downloadOriginal(d);$('excel-share').onclick=()=>shareMany([d]);

}
function renderExcelRows(){
 if(!excelModel)return;const sh=excelModel.sheets[excelActive],q=excelFilter.trim().toLocaleLowerCase('ar');excelRows=sh.rows.map((row,i)=>({row,i})).filter(x=>!q||x.row.some(v=>String(v??'').toLocaleLowerCase('ar').includes(q)));
 const size=80,pages=Math.max(1,Math.ceil(excelRows.length/size));excelPage=Math.max(0,Math.min(excelPage,pages-1));const subset=excelRows.slice(excelPage*size,(excelPage+1)*size),table=document.createElement('table');table.dir='ltr';const thead=document.createElement('thead'),tr=document.createElement('tr');const number=document.createElement('th');number.textContent='#';tr.appendChild(number);for(let n=0;n<sh.columns;n++){const th=document.createElement('th');th.textContent=excelColumn(sh.startColumn+n);tr.appendChild(th)}thead.appendChild(tr);table.appendChild(thead);const tbody=document.createElement('tbody');subset.forEach(({row,i})=>{const tr=document.createElement('tr'),n=document.createElement('th');n.textContent=sh.startRow+i+1;tr.appendChild(n);for(let j=0;j<sh.columns;j++){const td=document.createElement('td');td.textContent=String(row[j]??'');td.dir='auto';tr.appendChild(td)}tbody.appendChild(tr)});table.appendChild(tbody);const box=$('excel-content');box.replaceChildren(table);box.scrollTop=0;
 $('excel-status').textContent=`${excelRows.length} صف${q?' مطابق':''} · صفحة ${excelPage+1} من ${pages}`;$('excel-prev').disabled=excelPage===0;$('excel-next').disabled=excelPage>=pages-1;

}
$('excel-close').onclick=closeExcelTable;$('vtable').onclick=openExcelTable;$('excel-tabs').onchange=()=>{excelActive=+$('excel-tabs').value;excelPage=0;renderExcelRows()};let excelSearchTimer=0;$('excel-search').oninput=()=>{clearTimeout(excelSearchTimer);excelSearchTimer=setTimeout(()=>{excelFilter=$('excel-search').value;excelPage=0;renderExcelRows()},160)};$('excel-prev').onclick=()=>{excelPage--;renderExcelRows()};$('excel-next').onclick=()=>{excelPage++;renderExcelRows()};
