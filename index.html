/* ---------- multi-page scan -> one PDF (no library) ---------- */
async function makePdf(blobs){
  const imgs=[];
  for(const b of blobs){const bmp=await createImageBitmap(b),m=Math.min(1,1700/Math.max(bmp.width,bmp.height)),w=Math.round(bmp.width*m),h=Math.round(bmp.height*m),c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(bmp,0,0,w,h);const jb=await new Promise(r=>c.toBlob(r,"image/jpeg",.82));imgs.push({w,h,data:new Uint8Array(await jb.arrayBuffer())})}
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const add=x=>{const u=typeof x==="string"?enc.encode(x):x;parts.push(u);len+=u.length};
  const n=imgs.length,total=2+3*n;
  add("%PDF-1.4\n");offs[1]=len;add("1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n");
  offs[2]=len;add(`2 0 obj\n<< /Type /Pages /Kids [${imgs.map((_,i)=>`${3+3*i} 0 R`).join(" ")}] /Count ${n} >>\nendobj\n`);
  imgs.forEach((im,i)=>{
    const s=842/Math.max(im.w,im.h),pw=(im.w*s).toFixed(2),ph=(im.h*s).toFixed(2),pg=3+3*i,ct=4+3*i,ix=5+3*i,cs=`q ${pw} 0 0 ${ph} 0 0 cm /Im0 Do Q`;
    offs[pg]=len;add(`${pg} 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw} ${ph}] /Resources << /XObject << /Im0 ${ix} 0 R >> >> /Contents ${ct} 0 R >>\nendobj\n`);
    offs[ct]=len;add(`${ct} 0 obj\n<< /Length ${cs.length} >>\nstream\n${cs}\nendstream\nendobj\n`);
    offs[ix]=len;add(`${ix} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.data.length} >>\nstream\n`);add(im.data);add("\nendstream\nendobj\n");
  });
  const xo=len;let x=`xref\n0 ${total+1}\n0000000000 65535 f \n`;for(let i=1;i<=total;i++)x+=String(offs[i]).padStart(10,"0")+" 00000 n \n";
  add(x+`trailer\n<< /Size ${total+1} /Root 1 0 R >>\nstartxref\n${xo}\n%%EOF\n`);
  return new Blob(parts,{type:"application/pdf"});
}

/* =====================================================================
   READING ENGINE
   Layers of verification (nothing is "guessed" silently):
   1. Embedded text layer of PDFs (exact characters, no OCR error)
   2. MRZ check digits (ICAO 9303) for passports / ID cards
   3. Luhn check for UAE Emirates ID numbers
   4. Two independent AI readings (different models) compared letter by letter
   5. Fuzzy (Levenshtein) match of the name against the embedded text
   The result is "مؤكد" only if letter-exact agreement exists; otherwise the
   user must review. Without an API key only layers 1-3 run.
   ===================================================================== */
const DIAC=/[\u064B-\u065F\u0670\u0640\u06D6-\u06ED]/g;
const digitsFix=s=>String(s).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d));
const nStrict=s=>digitsFix(String(s||"").normalize("NFKC")).replace(DIAC,"").replace(/\s+/g," ").trim().toLowerCase();
const nLoose=s=>nStrict(s).replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/ؤ/g,"و").replace(/ئ/g,"ي").replace(/[^\p{L}\p{N} ]/gu,"").replace(/\s+/g," ").trim();
function lev(a,b,max=99){a=[...a];b=[...b];if(Math.abs(a.length-b.length)>max)return max+1;let prev=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){const cur2=[i];let mn=i;for(let j=1;j<=b.length;j++){const v=Math.min(prev[j]+1,cur2[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));cur2[j]=v;if(v<mn)mn=v}if(mn>max)return max+1;prev=cur2}return prev[b.length]}
function findInText(name,pages){
  const ns=nStrict(name),nl=nLoose(name);if(!ns||!pages.length)return null;
  const k=ns.split(" ").length;let best=null;
  for(const pg of pages){
    const base=String(pg).normalize("NFKC"),rev=base.split(/\n/).map(l=>[...l].reverse().join("")).join("\n");
    for(const txt of [base,rev]){
      const toks=txt.replace(DIAC,"").split(/\s+/).filter(Boolean);
      for(let w=Math.max(1,k-1);w<=k+1;w++)for(let i=0;i+w<=toks.length;i++){
        const win=toks.slice(i,i+w).join(" ");
        if(nStrict(win)===ns)return{kind:"exact",match:win,dist:0};
        const wl=nLoose(win);
        if(wl===nl){if(!best||best.dist>.5)best={kind:"loose",match:win,dist:.5}}
        else if(Math.abs(wl.length-nl.length)<=3){const d=lev(wl,nl,2);if(d<=2&&(!best||d<best.dist))best={kind:"near",match:win,dist:d}}
      }
    }
  }
  return best;

const EXTMIME={pdf:"application/pdf",jpg:"image/jpeg",jpeg:"image/jpeg",png:"image/png",webp:"image/webp",gif:"image/gif",heic:"image/heic",heif:"image/heif"};
async function isZip(f){if(ZIPRE.test(f.name||"")||/zip/.test(f.type||""))return true;if(f.size>=4){const h=new Uint8Array(await f.slice(0,4).arrayBuffer());return h[0]===0x50&&h[1]===0x4b&&h[2]===3&&h[3]===4}return false}
/* minimal ZIP reader: central directory + stored/deflate entries, streamed from the file (no full load in memory) */
async function readZip(file){
  const u16=(d,o)=>d.getUint16(o,true),u32=(d,o)=>d.getUint32(o,true);
  const tailLen=Math.min(file.size,65557),tail=new DataView(await file.slice(file.size-tailLen).arrayBuffer());
  let e=-1;for(let i=tailLen-22;i>=0;i--){if(u32(tail,i)===0x06054b50){e=i;break}}
  if(e<0)throw new Error("notzip");
  const n=u16(tail,e+10),cdSize=u32(tail,e+12),cdOff=u32(tail,e+16);
  if(n===0xFFFF||cdOff===0xFFFFFFFF||cdSize===0xFFFFFFFF)throw new Error("zip64");
  const cd=new DataView(await file.slice(cdOff,cdOff+cdSize).arrayBuffer()),cdb=new Uint8Array(cd.buffer);
  const out={files:[],skipped:0,encrypted:0};let p=0;
  for(let k=0;k<n&&p+46<=cd.byteLength;k++){
    if(u32(cd,p)!==0x02014b50)throw new Error("notzip");
    const flags=u16(cd,p+8),method=u16(cd,p+10),csz=u32(cd,p+20),nl=u16(cd,p+28),el=u16(cd,p+30),cl=u16(cd,p+32),lho=u32(cd,p+42);
    let name;try{name=new TextDecoder(flags&0x800?"utf-8":"utf-8",{fatal:true}).decode(cdb.subarray(p+46,p+46+nl))}catch(_){name=new TextDecoder("windows-1252").decode(cdb.subarray(p+46,p+46+nl))}
    p+=46+nl+el+cl;
    const base=name.split("/").pop(),ext=(base.split(".").pop()||"").toLowerCase();
    if(!base||name.endsWith("/")||/(^|\/)__MACOSX\//.test(name)||base.startsWith(".")){continue}
    if(!EXTMIME[ext]){out.skipped++;continue}
    if(flags&1){out.encrypted++;continue}
    if(method!==0&&method!==8){out.skipped++;continue}
    const lh=new DataView(await file.slice(lho,lho+30).arrayBuffer());
    if(u32(lh,0)!==0x04034b50)throw new Error("notzip");
    const start=lho+30+u16(lh,26)+u16(lh,28);let blob=file.slice(start,start+csz);
    if(method===8){
      if(typeof DecompressionStream==="undefined")throw new Error("nodecomp");
      blob=await new Response(blob.stream().pipeThrough(new DecompressionStream("deflate-raw"))).blob();
    }
    out.files.push(new File([blob],base,{type:EXTMIME[ext]}));
    if(out.files.length>=300)break;
  }
  return out;
}
async function expandAll(files){

    if(await isZip(f)){
      sheet(`<div class="pr"><div class="sp"></div><b>جارٍ فك الضغط…</b></div>`,true);
      try{const z=await readZip(f);hideSheet();

        const extra=[z.skipped?z.skipped+" ملف بصيغة غير مدعومة تم تخطيه":"",z.encrypted?z.encrypted+" ملف محمي تم تخطيه":""].filter(Boolean).join(" · ");
        toast("تم استخراج "+z.files.length+" ملف من «"+f.name+"»"+(extra?" ("+extra+")":""),{ms:4500});
        res.push(...z.files);
      }catch(e){hideSheet();toast(e.message==="zip64"?"هذا الملف المضغوط كبير جداً (ZIP64). فُكّه من تطبيق «الملفات» ثم اختر الملفات.":e.message==="nodecomp"?"هذا المتصفح لا يدعم فك الضغط. فُكّه من تطبيق «الملفات» ثم اختر الملفات.":"تعذّر قراءة الملف المضغوط؛ قد يكون تالفاً.",{err:1,ms:5500})}

}

async function safeAnalyze(blob,pdf){
  const useAI=!!getKey();
  const steps=useAI?["قراءة صفحات الملف","القراءة الأولى (Claude)","قراءة ثانية مستقلة للتأكد","مطابقة الأسماء وفحص الأرقام"]:["قراءة نص الملف وفحص الأرقام"];
  let aborter=new AbortController();curAbort=aborter;
  const draw=i=>{sheet(`<h3>جارٍ فحص المستند…</h3><ul class="stp">${steps.map((s,k)=>`<li class="${k<i?"done":k===i?"on":""}">${k<i?ico("check",16):k===i?'<span class="sp" style="width:16px;height:16px;border-width:2px"></span>':"○"} ${s}</li>`).join("")}</ul><p class="m">يفحص كل صفحات المستند. لا يُعتمد أي اسم دون تأكيد.</p><div class="row2"><button class="btn s" id="cx">تخطي الفحص</button></div>`,true);$("cx").onclick=()=>aborter.abort()};
  draw(0);
  try{return await analyze(blob,pdf,{signal:aborter.signal,onStep:i=>draw(Math.min(i,steps.length-1))})}
  catch(e){
    let msg="";
    if(e.name==="AbortError")msg="تم تخطي الفحص الذكي. اكتب العنوان بنفسك أو راجع القراءة المحلية";
    else if(e.message==="key")msg="مفتاح القراءة الذكية غير صحيح. عدّله من الإعدادات.";
    else if(e.message==="nokey")msg="";
    else msg=(navigator.onLine===false?"لا يوجد اتصال بالإنترنت.":"تعذّر إكمال القراءة الذكية.")+" استُخدم الفحص المحلي فقط.";

async function readBackup(file){

const PINK="awraqi_pin2";let pinBuf="",fails=0,lockUntil=0,hiddenAt=0;

const hasPin=()=>!!ls.get(PINK);

  if(!hasPin())return;lockedNow=true;pinBuf="";
  const L3=$("lock");L3.style.display="flex";
  L3.innerHTML=`<div class="logo"><img src="icon-192.png" alt=""></div><h2 class="gt">أدخل الرمز</h2><div class="dots" id="dots"><i></i><i></i><i></i><i></i></div><div class="m" id="lm" style="min-height:22px"></div><div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join("")}<button data-k="x" style="font-size:16px">نسيت؟</button><button data-k="0">0</button><button data-k="d">${ico("back",24)}</button></div>`;
  L3.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>keyPress(b.dataset.k));
}
function dots(){document.querySelectorAll("#dots i").forEach((e,i)=>e.classList.toggle("f",i<pinBuf.length))}
async function keyPress(k){
  if(k==="x"){forgotSheet();return}
  if(k==="d"){pinBuf=pinBuf.slice(0,-1);dots();return}
  if(Date.now()<lockUntil){$("lm").textContent="حاول بعد "+Math.ceil((lockUntil-Date.now())/1000)+" ثانية";return}
  if(pinBuf.length>=4)return;pinBuf+=k;dots();
  if(pinBuf.length<4)return;
  const [salt,h]=ls.get(PINK).split(":"),ok=(await hashPin(pinBuf,unhex(salt)))===h;
  if(ok){fails=0;lockedNow=false;$("lock").style.display="none";$("lock").innerHTML=""}

}

  $("ks").onclick=()=>{const v=$("ky").value.trim();if(v&&!/^sk-ant-/.test(v)){toast("المفتاح يجب أن يبدأ بـ sk-ant-",{err:1});return}v?ls.set("awraqi_key",v):ls.del("awraqi_key");hideSheet();toast(getKey()?"تم تفعيل القراءة الذكية ✓":"تم حذف المفتاح")};
  $("kd").onclick=()=>{ls.del("awraqi_key");hideSheet();toast("تم حذف المفتاح")};
}
async function updateApp(){
  sheet(`<div class="pr"><div class="sp"></div><b>جارٍ التحديث…</b></div>`,true);
  try{if("serviceWorker" in navigator)for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister();for(const k of await caches.keys())await caches.delete(k)}catch(e){}
  location.reload();
}
