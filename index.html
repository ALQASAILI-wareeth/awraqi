  const tailLen=Math.min(file.size,65557+22),tailStart=file.size-tailLen,tail=new DataView(await file.slice(tailStart).arrayBuffer());
  let e=-1;for(let i=tailLen-22;i>=0;i--){if(u32(tail,i)===0x06054b50){e=i;break}}
  if(e<0)throw new Error("notzip");
  let n=u16(tail,e+10),cdSize=u32(tail,e+12),cdOff=u32(tail,e+16);
  if(n===0xFFFF||cdOff===0xFFFFFFFF||cdSize===0xFFFFFFFF){
    /* ZIP64: locator sits right before the end-of-central-directory record */
    let loc=null;
    if(e>=20&&u32(tail,e-20)===0x07064b50)loc=new DataView(tail.buffer,e-20,20);
    else{const lo=tailStart+e-20;if(lo>=0)loc=new DataView(await file.slice(lo,lo+20).arrayBuffer());}
    if(!loc||u32(loc,0)!==0x07064b50)throw new Error("zip64");
    const off64=u64(loc,8),r=new DataView(await file.slice(off64,off64+56).arrayBuffer());
    if(r.byteLength<56||u32(r,0)!==0x06064b50)throw new Error("zip64");
    n=u64(r,32);cdSize=u64(r,40);cdOff=u64(r,48);
  }
  const cd=new DataView(await file.slice(cdOff,cdOff+cdSize).arrayBuffer()),cdb=new Uint8Array(cd.buffer);
  const out={files:[],saved:0,skipped:0,encrypted:0,details:[]};let p=0;
  for(let k=0;k<n&&p+46<=cd.byteLength;k++){
    if(u32(cd,p)!==0x02014b50)throw new Error("notzip");
    const flags=u16(cd,p+8),method=u16(cd,p+10),nl=u16(cd,p+28),el=u16(cd,p+30),cl=u16(cd,p+32);
    let csz=u32(cd,p+20),usz=u32(cd,p+24),lho=u32(cd,p+42);
    if(usz===0xFFFFFFFF||csz===0xFFFFFFFF||lho===0xFFFFFFFF){
      let q=p+46+nl;const end=q+el;
      while(q+4<=end){const id=u16(cd,q),sz=u16(cd,q+2);if(id===1){let r=q+4;if(usz===0xFFFFFFFF){usz=u64(cd,r);r+=8}if(csz===0xFFFFFFFF){csz=u64(cd,r);r+=8}if(lho===0xFFFFFFFF){lho=u64(cd,r);r+=8}break}q+=4+sz}
    }
    let name;try{name=new TextDecoder("utf-8",{fatal:true}).decode(cdb.subarray(p+46,p+46+nl))}catch(_){name=new TextDecoder("windows-1252").decode(cdb.subarray(p+46,p+46+nl))}
    p+=46+nl+el+cl;
    const base=name.split("/").pop(),ext=(base.split(".").pop()||"").toLowerCase();
    if(!base||name.endsWith("/"))continue;
    if(opts.only&&!opts.only.test(name))continue;
    if(flags&1){out.encrypted++;out.details.push({name:base,reason:"محمي بكلمة مرور"});continue}
    if(method!==0&&method!==8){out.skipped++;out.details.push({name:base,reason:"طريقة ضغط غير مدعومة؛ فك الضغط أولاً"});continue}
    const lh=new DataView(await file.slice(lho,lho+30).arrayBuffer());
    if(u32(lh,0)!==0x04034b50)throw new Error("notzip");
    const start=lho+30+u16(lh,26)+u16(lh,28);let blob=file.slice(start,start+csz);
    if(opts.saveStream){
      try{let stream=blob.stream();if(method===8){if(typeof DecompressionStream==='undefined')throw new Error('nodecomp');stream=stream.pipeThrough(new DecompressionStream('deflate-raw'))}
       await opts.saveStream({name:base,archivePath:name,size:usz,type:EXTMIME[ext]||'application/octet-stream'},stream);out.saved++;
      }catch(e){out.details.push({name:base,reason:'تعذّر حفظ هذا العنصر؛ أُدرج الأرشيف الأصلي للحفظ'})}
      continue;
    }
    if(method===8){
      if(typeof DecompressionStream==="undefined")throw new Error("nodecomp");
      blob=await new Response(blob.stream().pipeThrough(new DecompressionStream("deflate-raw"))).blob();
    }
    const entry=new File([blob],base,{type:EXTMIME[ext]||"application/octet-stream"});entry.archivePath=name;out.files.push(entry);
  }
  return out;
}

/* ---------- analysis UI ---------- */
async function safeAnalyze(blob,pdf){
  if(isExcel(blob))return excelLocalInfo(blob);
  if(!isPdf(blob)&&!isImg(blob))return generalFileInfo(blob);
  if(blob.size>8*1048576)return generalFileInfo(blob);
  const useAI=!!getKey();
  const steps=useAI?["قراءة صفحات الملف","القراءة السريعة (Claude)","مطابقة الأسماء وفحص الأرقام"]:["قراءة نص الملف وفحص الأرقام"];
  let aborter=new AbortController();curAbort=aborter;
  const draw=i=>{sheet(`<h3>جارٍ فحص المستند…</h3><ul class="stp">${steps.map((s,k)=>`<li class="${k<i?"done":k===i?"on":""}">${k<i?ico("check",16):k===i?'<span class="sp" style="width:16px;height:16px;border-width:2px"></span>':"○"} ${s}</li>`).join("")}</ul><p class="m">يفحص كل صفحات المستند. لا يُعتمد أي اسم دون تأكيد.</p><div class="row2"><button class="btn s" id="cx">تخطي الفحص</button></div>`,true);$("cx").onclick=()=>aborter.abort()};
  draw(0);
  try{return await analyze(blob,pdf,{signal:aborter.signal,onStep:i=>draw(Math.min(i,steps.length-1))})}
  catch(e){
    let msg="";
    if(e.name==="AbortError")msg="تم تخطي الفحص الذكي. اكتب العنوان بنفسك أو راجع القراءة المحلية";
    else if(e.message==="key")msg="مفتاح القراءة الذكية غير صحيح. عدّله من الإعدادات.";
    else if(e.message==="nokey")msg="";
    else msg=(navigator.onLine===false?"لا يوجد اتصال بالإنترنت.":"تعذّر إكمال القراءة الذكية.")+" استُخدم الفحص المحلي فقط.";
    if(msg)toast(msg,{err:e.name!=="AbortError",ms:5000});
    try{return await analyze(blob,pdf,{noai:true})}
    catch(e2){return{type:"other",label:"",name:"",cands:[],good:[],warn:["تعذّر فحص هذا الملف؛ قد يكون تالفاً. تأكد أنه يفتح قبل الحفظ."],level:"none",title:"",cat:null,exp:"",summary:""}}
  }
}

async function saveDoc(f,o){

}

function organizeReview(out,total){
  if(!out.length){hideSheet();toast("لم يُفحص أي مستند");return}
  const items=out.map(({d,r})=>{
    const ok=r&&r.level!=="none"&&(r.cat||r.title);
    const newCat=r&&r.cat&&r.cat!==d.cat?r.cat:null,newTitle=r&&r.title&&r.level!=="none"&&r.title!==d.title?r.title:null;
    return{d,r,newCat,newTitle,verified:r&&r.level==="verified",change:!!(newCat||newTitle||(r&&r.exp&&!d.exp)),ok};
  });

async function saveCategory(name,oldName=null){
 name=String(name||'').trim().normalize('NFC');
 if(!name||name.length>60)throw new Error('اكتب اسمًا من حرف إلى ستين حرفًا');

 if(oldName&&!CATS.some(([n])=>n===oldName))throw new Error('البطاقة غير موجودة');

 const aliases=Object.assign(Object.create(null),categoryAliases);if(oldName&&oldName!==name)aliases[oldName]=name;
 // Renaming back to an earlier name must not form an alias cycle.
 delete aliases[name];for(const k of Object.keys(aliases))if(aliases[k]===oldName)aliases[k]=name;
 const metadata=await req(store('meta').getAll());
 await new Promise((ok,no)=>{const tx=db.transaction(['meta','files'],'readwrite');for(const d of metadata)if(oldName&&d.cat===oldName)tx.objectStore('meta').put({...d,cat:name});tx.objectStore('files').put({id:CATEGORY_CONFIG_ID,catalog,aliases});tx.oncomplete=ok;tx.onerror=tx.onabort=()=>no(tx.error||new Error('تعذّر حفظ البطاقة'))});

}

const clipTypeRank=t=>/^image\/(jpeg|png|heic|heif|webp|gif)$/.test(t)?0:t==='application/pdf'?1:/^video\//.test(t)?2:/^audio\//.test(t)?3:/^text\/plain$/.test(t)?9:/^text\/html$/.test(t)?10:5;

const autoOn=()=>ls.get('awraqi_auto')!=='off';
let autoBusy=false,autoTimer=0,aiBudget=25;
function scheduleAuto(ms=4000){clearTimeout(autoTimer);autoTimer=setTimeout(function tick(){if(!db||lockedNow||viewerOpen||sheetOn()||busy||aiRunning||DRAG.on||selMode){autoTimer=setTimeout(tick,3000);return}autoOrganize()},ms)}
async function autoOrganize(){
 if(autoBusy||!autoOn())return;autoBusy=true;const moves=[],trashed=[];
 try{
  // 1) unsorted files («أخرى») go to their card: offline recognition first, then Claude for images and scans (if a key is set)
  const other=pickCard('أخرى')||'أخرى';
  for(const d of live().filter(x=>!isAppleSidecar(x)&&x.cat===other&&(!x.autoL||(!x.autoA&&getKey()&&['img','pdf'].includes(x.type))))){
   if(!autoOn()||lockedNow)break;const before={cat:d.cat,title:d.title,exp:d.exp};let c=null;
   if(!d.autoL){try{c=await localCard(d)}catch(e){}d.autoL=1}
   if(!c&&!d.autoA&&getKey()&&aiBudget>0&&['img','pdf'].includes(d.type)&&(d.size||0)<=8*1048576){
    aiBudget--;aiStatus('يرتّب أوراقي مستنداتك…');
    try{const blob=await getBlob(d.id),r=await analyze(new File([blob],d.name||'file',{type:d.mime||blob.type}),d.type==='pdf');d.autoA=1;c=pickCard(r.cat);
     if(r.level!=='none'){if(r.title&&/^مستند\s/.test(d.title||''))d.title=r.title;if(r.exp&&!d.exp)d.exp=r.exp;if(r.summary&&!d.summary)d.summary=r.summary;d.kind=d.kind||r.label||'';d.ver=d.ver||r.level}}
    catch(e){if(e.message==='key'||e.message==='nokey'||navigator.onLine===false)aiBudget=0}
   }
   if(c&&c!==d.cat){d.cat=c;moves.push([d.id,before])}
   try{await put(d)}catch(e){}
  }
  aiStatus('');
  // 2) duplicates inside the same card: keep the oldest, move the rest to «المحذوفات»
  const groups=new Map();for(const d of live()){if(isAppleSidecar(d)||d.keepDup)continue;const s=await docSize(d);if(s<0)continue;const k=d.cat+'\u0000'+s;if(!groups.has(k))groups.set(k,[]);groups.get(k).push(d)}
  for(const g of groups.values()){if(g.length<2)continue;const byFp=new Map();for(const d of g){try{const fp=await docFp(d);if(!byFp.has(fp))byFp.set(fp,[]);byFp.get(fp).push(d)}catch(e){}}
   for(const same of byFp.values()){if(same.length<2)continue;same.sort((a,b)=>(a.ts||0)-(b.ts||0));for(const d of same.slice(1)){d.del=Date.now();try{await put(d);trashed.push(d.id)}catch(e){delete d.del}}}}
 }finally{autoBusy=false;aiStatus('')}
 if(!moves.length&&!trashed.length)return;
 await load();renderAll();
 const parts=[];if(moves.length)parts.push(`نقل ${moves.length} إلى ${moves.length>1?'بطاقاتها':'بطاقته'}`);if(trashed.length)parts.push(`أزال ${trashed.length} مكرر`);
 toast('رتّب أوراقي مستنداتك: '+parts.join(' و'),{act:'تراجع',ms:9000,fn:async()=>{
  for(const [id,b] of moves){const d=docs.find(x=>x.id===id);if(d){Object.assign(d,b);await put(d)}}
  for(const id of trashed){const d=docs.find(x=>x.id===id);if(d){delete d.del;d.keepDup=1;await put(d)}}
  await load();renderAll();toast('تم التراجع')}});
}

/* 4.7.1: long-press a card -> its contents as a dropdown list (small thumbnail, name, format) */
function catPeek(b){
 const c=b.dataset.c,rows=live().filter(d=>d.cat===c&&!isAppleSidecar(d));closeMenu();
 const m=document.createElement('div');m.id='pm';m.className='drop';m.setAttribute('role','menu');m.setAttribute('aria-label',c);
 m.innerHTML=`<div class="file-menu-heading"><b>${esc(c)}</b><span>${rows.length} ${rows.length===1?'مستند':'مستندات'}</span></div>${rows.length?`<div class="drop-list">${rows.map(d=>`<button class="drop-row nolp" data-o="${esc(d.id)}">${thumbH(d)}<span><b>${esc(d.title)}</b><small>${esc(docFormat(d))}${d.size?' · '+sizeLabel(d.size):''}${d.exp?' · ينتهي '+fmt(d.exp+'T00:00:00'):''}</small></span></button>`).join('')}</div>`:'<div class="empty">لا توجد مستندات في هذه البطاقة بعد.</div>'}<div class="peek-actions"><button data-a="open">${ico('folder',18)} فتح البطاقة</button>${clip?`<button data-a="paste">${ico('clip',18)} لصق هنا</button>`:''}<button data-a="rename">${ico('edit',18)} تسمية</button></div>`;
 document.body.appendChild(m);
 const r=b.getBoundingClientRect(),w=Math.min(360,innerWidth-20);m.style.width=w+'px';
 let left=r.left+r.width/2-w/2;left=Math.max(10,Math.min(left,innerWidth-w-10));m.style.left=left+'px';
 const below=innerHeight-r.bottom-120,above=r.top-16,up=below<260&&above>below,room=Math.max(200,(up?above:below));
 m.style.maxHeight=Math.min(room,innerHeight*.72)+'px';m.style.top=(up?Math.max(10,r.top-6-Math.min(m.offsetHeight,room)):r.bottom+6)+'px';m.classList.toggle('up',up);
 requestAnimationFrame(()=>m.classList.add('on'));observeFileThumbs(m);
 m.querySelectorAll('[data-o]').forEach(t=>t.onclick=()=>{closeMenu();view(t.dataset.o,rows)});
 m.querySelectorAll('[data-a]').forEach(a=>a.onclick=()=>{const k=a.dataset.a;closeMenu();if(k==='open')openCat(c);else if(k==='paste')pasteInto(c);else categoryEditor(c)});
 const list=m.querySelector('.drop-list');swipeDown(m,{scroller:()=>list,move:(dy,an)=>slide(m,dy,an),close:()=>{m.style.transition='opacity .15s';m.style.opacity='0';setTimeout(closeMenu,150)}});
 setTimeout(()=>document.addEventListener('pointerdown',outside,true),30);vib();
}
menu=catPeek;

/* ---------- bar + boot ---------- */
$("gear").innerHTML=ico("gear",22);$("gear").onclick=settingsSheet;
$("ib1").innerHTML=ico("home");$("ib2").innerHTML=ico("plus");$("ib3").innerHTML=ico("search");$("vc").innerHTML=ico("x",22);$("vsh").innerHTML=ico("share",22);
$("bh").onclick=()=>{hideSheet();closeMenu();$("q").value="";goHome();renderHome();scrollTo({top:0,behavior:"smooth"})};
$("bq").onclick=()=>{goHome();openSearchSheet()};
{const ro=()=>document.documentElement.style.setProperty("--bh",$("ban").offsetHeight+"px");ro();addEventListener("resize",ro);if(window.ResizeObserver)new ResizeObserver(ro).observe($("ban"))}
addEventListener("unhandledrejection",e=>{console.warn(e.reason)});
(async()=>{
  try{
    db=await openDB();await load();
    if(!ls.get("awraqi_first"))ls.set("awraqi_first",String(Date.now()));
    const old=trash().filter(d=>Date.now()-d.del>30*864e5);for(const d of old)await removeForever(d.id);if(old.length)await load();
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
  }catch(e){
    $("home").innerHTML=`<div class="onb"><div class="oi">${ico("alert",32)}</div><h3>التخزين غير متاح</h3><p>لا يستطيع هذا المتصفح حفظ المستندات. افتح التطبيق من أيقونته على الشاشة الرئيسية، وتأكد أنك لا تستخدم التصفح الخاص.</p></div>`;
    $("splash").classList.add("out");return;
  }
  renderHome();clipUI();
  showLock();
  setTimeout(()=>$("splash").classList.add("out"),sessionStorage.getItem("awraqi_s")?100:1100);try{sessionStorage.setItem("awraqi_s","1")}catch(e){}
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
  
})();
</script>
