<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060e1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="أوراقي">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>أوراقي</title>
<style>
:root{--bg:#060e1a;--bg2:#0a1830;--card:#0f1f38;--card2:#152a4b;--tx:#f3ecd9;--mut:#9fb0c3;--gold:#d4b062;--gold2:#f1d98d;--bd:rgba(212,176,98,.3);--bad:#e5766c;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 "Geeza Pro","Damascus","Noto Naskh Arabic","Segoe UI",Tahoma,sans-serif}
body{padding-bottom:calc(120px + var(--sab));overscroll-behavior-y:none;background:radial-gradient(120% 60% at 50% 0,#0f2a52 0,transparent 60%) no-repeat,var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
.nolp{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.ban{position:sticky;top:0;z-index:30;padding:calc(10px + var(--sat)) 14px 14px;color:#fff;background:repeating-linear-gradient(45deg,rgba(212,176,98,.07) 0 1px,transparent 1px 20px),repeating-linear-gradient(-45deg,rgba(212,176,98,.07) 0 1px,transparent 1px 20px),linear-gradient(135deg,#061226 0%,#0f2a52 60%,#0a1f40 100%);border-bottom:1px solid var(--gold);border-radius:0 0 26px 26px;box-shadow:0 14px 34px rgba(0,0,0,.55);transition:transform .35s ease}
.ban.hid{transform:translateY(-110%)}
.bt{display:flex;align-items:center;gap:12px;max-width:720px;margin:0 auto}
.logo{width:50px;height:50px;border-radius:16px;overflow:hidden;border:1.5px solid var(--gold);box-shadow:0 0 18px rgba(212,176,98,.35);flex:none}.logo img{width:100%;height:100%;display:block}
.bh{margin:0;font-size:25px;line-height:1.2;color:var(--gold2);letter-spacing:.5px}.bs{margin:0;color:#c9d3df;font-size:12.5px}
.gear{margin-inline-start:auto;border:1px solid var(--bd);background:rgba(255,255,255,.05);color:var(--gold2);border-radius:50%;width:40px;height:40px;font-size:18px}
.stats{display:flex;gap:8px;justify-content:center;margin:12px auto 0;max-width:720px}
.stats div{flex:1;border:1px solid var(--bd);background:rgba(6,14,26,.45);border-radius:14px;padding:3px 4px;text-align:center}
.stats b{display:block;font-size:16px;color:var(--gold2);line-height:1.45}.stats span{font-size:11.5px;color:#b9c6d4}
.w{max-width:720px;margin:0 auto;padding:14px 16px}
.sb input,#shc input,#shc select{width:100%;padding:13px 16px;border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);font:inherit}
.sb input::placeholder{color:#7b8da3}.sb input:focus,#shc input:focus{outline:1.5px solid var(--gold)}
.orn{display:flex;align-items:center;gap:10px;color:var(--gold2);font-size:16px;margin:20px 0 10px;font-weight:700}
.orn:before,.orn:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}.orn:after{background:linear-gradient(270deg,transparent,var(--gold))}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--bd);border-radius:22px;box-shadow:inset 0 0 0 4px var(--bg2),inset 0 0 0 5px var(--bd),0 8px 18px rgba(0,0,0,.35);min-height:156px;padding:18px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;animation:fin .45s ease both;animation-delay:calc(var(--i)*70ms);transition:transform .15s}
.cat:active{transform:scale(.97)}
.cat .e{width:62px;height:62px;display:grid;place-items:center;font-size:28px;border-radius:50%;border:1.5px solid var(--gold);background:rgba(212,176,98,.09);margin-bottom:4px}
.cat b{font-size:17px;color:var(--tx)}.cat .sub{font-size:12.5px;color:var(--mut)}
.cat .bd{position:absolute;top:14px;inset-inline-start:14px;min-width:26px;height:26px;padding:0 7px;border-radius:13px;background:linear-gradient(145deg,var(--gold2),var(--gold));color:#10161f;font-weight:700;font-size:13.5px;display:grid;place-items:center}
.rl{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px}
.rc{flex:0 0 150px;text-align:start;background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--bd);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px;animation:fin .4s ease both}
.rc i{font-style:normal;font-size:24px}.rc b{font-size:14.5px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.rc span{font-size:12px;color:var(--mut)}
.top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.top h2{margin:0;flex:1;color:var(--gold2);font-size:21px}
.back,.pst{border:1px solid var(--bd);background:rgba(212,176,98,.1);color:var(--gold2);border-radius:12px;padding:8px 13px;font-weight:700}
.doc{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--bd);border-inline-start:3px solid var(--gold);border-radius:14px;padding:10px 12px;margin-bottom:10px;display:flex;align-items:center;gap:10px;animation:fin .3s ease both}
.doc .t{flex:1;min-width:0;text-align:start;background:none;border:0;padding:0}
.doc .t b{display:block;font-size:16.5px;overflow-wrap:anywhere}.doc .t span{color:var(--mut);font-size:13px}
.doc .ic{font-size:26px}.mo{border:0;background:rgba(212,176,98,.1);color:var(--gold2);width:40px;height:40px;border-radius:50%;font-size:22px;line-height:1}
.empty{text-align:center;color:var(--mut);padding:30px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(104px + var(--sab));z-index:70;background:var(--gold);color:#10161f;font-weight:700;padding:10px 18px;border-radius:20px;font-size:14.5px;display:none;max-width:90%;text-align:center}
.btn{border:0;border-radius:12px;padding:12px 18px;background:linear-gradient(145deg,var(--gold2),var(--gold));color:#10161f;font-weight:700}.btn.s{background:rgba(212,176,98,.12);color:var(--gold2);border:1px solid var(--bd)}
.adds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 4px}
.add{border:1px solid var(--bd);background:rgba(212,176,98,.1);color:var(--gold2);border-radius:14px;padding:14px 4px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}.add i{font-style:normal;font-size:24px}
#clip{position:fixed;left:12px;right:12px;bottom:calc(96px + var(--sab));z-index:34;display:none;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--gold);border-radius:16px;padding:8px 10px;max-width:696px;margin:0 auto;box-shadow:0 8px 24px rgba(0,0,0,.5);font-size:14px}
#clip span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#clip button{border:0;border-radius:10px;padding:7px 12px;font-weight:700}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:35;display:flex;justify-content:center}
#bar .in{width:100%;max-width:720px;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:end;background:rgba(8,18,34,.94);border-top:1px solid var(--gold);box-shadow:0 -10px 28px rgba(0,0,0,.55);padding:6px 10px calc(8px + var(--sab));border-radius:22px 22px 0 0;backdrop-filter:blur(10px)}
#bar button{border:0;background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;font-size:12px;padding:6px 0;font-weight:700}
#bar button i{font-style:normal;font-size:22px}#bar button.on{color:var(--gold2)}
#bar .mid i{width:56px;height:56px;margin-top:-28px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,var(--gold2),#b8902f);color:#10161f;font-size:30px;box-shadow:0 8px 20px rgba(212,176,98,.45);border:3px solid var(--bg)}
#sheet{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.6);display:none;align-items:flex-end}#sheet.on{display:flex}
#shc{width:100%;max-width:720px;margin:0 auto;background:var(--card);border-top:1px solid var(--gold);border-radius:24px 24px 0 0;padding:18px 16px calc(18px + var(--sab));max-height:85vh;overflow-y:auto;animation:fin .25s ease}
#shc h3{margin:0 0 8px;color:var(--gold2)}#shc input,#shc select{margin:6px 0}.row2{display:flex;gap:8px;margin-top:10px}.row2 .btn{flex:1}.m{color:var(--mut);font-size:14px;margin:4px 0}
.act{display:flex;align-items:center;gap:12px;width:100%;text-align:start;border:0;background:none;padding:13px 6px;border-bottom:1px solid rgba(212,176,98,.14);font-size:16.5px}.act i{font-style:normal;width:28px;text-align:center}.act.d{color:var(--bad)}
#pm{position:fixed;z-index:40;background:var(--card);border:1px solid var(--gold);border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.6);max-height:50vh;overflow-y:auto;padding:6px}
#pm .ph{font-weight:700;color:var(--gold2);padding:6px 10px;border-bottom:1px solid var(--bd);margin-bottom:4px}
#pm button{display:block;width:100%;text-align:start;border:0;background:none;padding:10px;border-radius:10px;overflow-wrap:anywhere}#pm .pe{color:var(--mut);padding:10px}
#pv{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:20px}#pv.on{display:flex}
.pvc{width:min(300px,100%);background:var(--card);border:1px solid var(--gold);border-radius:20px;padding:12px;box-shadow:0 18px 50px rgba(0,0,0,.7);animation:pop .22s ease}
.pvt{font-weight:700;color:var(--gold2);margin:2px 4px 8px;overflow-wrap:anywhere}
.pvb{background:#fff;border-radius:10px;overflow:hidden;max-height:52vh;display:grid;place-items:center;min-height:120px}.pvb img,.pvb canvas{display:block;width:100%;height:auto}
.pvf{display:flex;gap:8px;margin-top:10px}.pvf .btn{flex:1;padding:9px}
#v{position:fixed;inset:0;z-index:50;background:#04070d;display:none}
#vh{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;gap:10px;padding:calc(8px + var(--sat)) 12px 10px;color:#fff;background:linear-gradient(180deg,rgba(6,18,38,.96),rgba(6,18,38,.78));border-bottom:1px solid rgba(212,176,98,.5);transition:transform .3s}
#vh.hid{transform:translateY(-110%)}
#vh b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--gold2)}#vh button{border:1px solid var(--bd);background:rgba(255,255,255,.08);color:#fff;border-radius:10px;padding:6px 12px}
#vp{position:absolute;inset:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;direction:ltr;-webkit-overflow-scrolling:touch;transition:transform .25s}
#vp.nt{transition:none}
.sl{flex:0 0 100%;width:100%;height:100%;scroll-snap-align:center;scroll-snap-stop:always;overflow-y:auto;padding:calc(64px + var(--sat)) 0 calc(56px + var(--sab));-webkit-overflow-scrolling:touch}
.sl canvas,.sl img{display:block;width:100%;height:auto;background:#fff;margin:0 auto}.sl .ph0{color:#aaa;text-align:center;padding:40px}
#vi{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + var(--sab));z-index:3;background:rgba(6,18,38,.85);border:1px solid var(--bd);color:var(--gold2);border-radius:16px;padding:3px 14px;font-size:13px;direction:ltr}
#vlift{position:absolute;top:calc(58px + var(--sat));left:50%;transform:translateX(-50%);z-index:4;background:var(--gold);color:#10161f;border-radius:14px;padding:2px 12px;font-size:12.5px;font-weight:700;display:none}
input[type=file]{display:none}
@keyframes fin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="ban" id="ban">
  <div class="bt"><div class="logo"><img src="icon-192.png" alt=""></div><div><h1 class="bh">أوراقي</h1><p class="bs">خزانتك الرسمية للوثائق والاتفاقيات</p></div><button class="gear" id="gear" aria-label="الإعدادات">⚙︎</button></div>
  <div class="stats"><div><b id="sN" data-v="0">0</b><span>مستند محفوظ</span></div><div><b id="sL">—</b><span>آخر إضافة</span></div><div><b>6</b><span>أقسام</span></div></div>
</header>
<main class="w">
  <div id="home">
    <div class="sb"><input id="q" placeholder="ابحث عن مستند أو اتفاقية…" aria-label="بحث"></div>
    <section id="recent" style="display:none"><div class="orn">◆ آخر المستندات ◆</div><div class="rl" id="rlist"></div></section>
    <div class="orn">◆ الأقسام ◆</div>
    <div class="grid" id="grid"></div><div id="res" style="display:none"></div>
  </div>
  <div id="cv" style="display:none">
    <div class="top"><button class="back" id="back">→ رجوع</button><h2 id="ct"></h2><button class="pst" id="pst">📋 لصق</button></div>
    <div id="list"></div>
  </div>
</main>
<div class="toast" id="toast"></div>
<div id="clip"><span id="clt"></span><button id="clp" class="btn">لصق هنا</button><button id="clx" class="btn s">✕</button></div>
<nav id="bar"><div class="in"><button id="bh" class="on"><i>🏠</i>الرئيسية</button><button id="ba" class="mid"><i>＋</i>إضافة</button><button id="bq"><i>🔎</i>بحث</button></div></nav>
<div id="sheet"><div id="shc"></div></div>
<div id="pv"></div>
<div id="v"><div id="vh"><button id="vc">✕ إغلاق</button><b id="vt"></b><button id="vsh">📤 مشاركة</button></div><div id="vp"></div><div id="vlift">اسحب للأعلى أو للأسفل ثم أفلت للإغلاق</div><div id="vi"></div></div>
<input type="file" id="icam" accept="image/*" capture="environment">
<input type="file" id="ipho" accept="image/*" multiple>
<input type="file" id="ifil" accept="application/pdf,image/*,.pdf" multiple>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const CATS=[["اتفاقيات","🤝"],["أعمالي","💼"],["أوراق شخصية","🪪"],["فواتير","🧾"],["شهادات ورخص","🎓"],["أخرى","🗂️"]];
const MODEL="claude-sonnet-5-5";
const $=id=>document.getElementById(id);
const esc=s=>{const d=document.createElement("div");d.textContent=s??"";return d.innerHTML};
const fmt=t=>new Date(t).toLocaleDateString("ar-AE");
const vib=()=>{try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}};
const getKey=()=>{try{return localStorage.getItem("awraqi_key")||""}catch(e){return""}};
let db,docs=[],cur=null,curDoc=null,queue=[],qTotal=0,qDone=0,clip=null;
if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

// ---------- storage (IndexedDB, on this phone only) ----------
const req=r=>new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const store=(n,m)=>db.transaction(n,m||"readonly").objectStore(n);
function open(){return new Promise((ok,no)=>{const r=indexedDB.open("awraqi",1);r.onupgradeneeded=()=>{r.result.createObjectStore("meta",{keyPath:"id"});r.result.createObjectStore("files",{keyPath:"id"})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function load(){docs=(await req(store("meta").getAll())).sort((a,b)=>b.ts-a.ts)}
function put(meta,blob){const t=db.transaction(["meta","files"],"readwrite");t.objectStore("meta").put(meta);if(blob)t.objectStore("files").put({id:meta.id,blob});return new Promise((ok,no)=>{t.oncomplete=ok;t.onerror=()=>no(t.error)})}
function remove(id){const t=db.transaction(["meta","files"],"readwrite");t.objectStore("meta").delete(id);t.objectStore("files").delete(id);return new Promise(ok=>t.oncomplete=ok)}
const getBlob=async id=>(await req(store("files").get(id))).blob;
const newId=()=>"d"+Date.now()+Math.random().toString(36).slice(2,6);
const toast=m=>{const t=$("toast");t.textContent=m;t.style.display=m?"block":"none";clearTimeout(toast.h);if(m)toast.h=setTimeout(()=>t.style.display="none",2800)};

// ---------- long-press helper ----------
function lp(el,onLong,onTap){
  let tm=null,fired=false,sx=0,sy=0;const clr=()=>clearTimeout(tm);
  el.addEventListener("touchstart",e=>{fired=false;sx=e.touches[0].clientX;sy=e.touches[0].clientY;tm=setTimeout(()=>{fired=true;vib();onLong()},430)},{passive:true});
  el.addEventListener("touchmove",e=>{if(Math.abs(e.touches[0].clientX-sx)>10||Math.abs(e.touches[0].clientY-sy)>10)clr()},{passive:true});
  el.addEventListener("touchend",clr);el.addEventListener("touchcancel",clr);
  el.addEventListener("contextmenu",e=>{e.preventDefault();fired=true;onLong()});
  el.addEventListener("click",e=>{if(fired){fired=false;e.preventDefault();return}onTap(e)});
}

// ---------- home ----------
function cnt(id,to){const el=$(id),from=+el.dataset.v||0;el.dataset.v=to;if(from===to||matchMedia("(prefers-reduced-motion:reduce)").matches){el.textContent=to;return}const t0=performance.now();(function s(t){const p=Math.min(1,(t-t0)/600);el.textContent=Math.round(from+(to-from)*p);if(p<1)requestAnimationFrame(s)})(t0)}
function docRow(d,full){return `<div class="doc"><div class="ic">${d.type==="pdf"?"📕":"🖼️"}</div><button class="t nolp" data-o="${d.id}"><b>${esc(d.title)}</b><span>${full?esc(d.cat)+" · ":""}${fmt(d.ts)}</span></button><button class="mo" data-m="${d.id}" aria-label="خيارات">⋯</button></div>`}
function wire(root){
  root.querySelectorAll("[data-o]").forEach(b=>lp(b,()=>preview(b.dataset.o),()=>view(b.dataset.o)));
  root.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>actSheet(b.dataset.m));
}
function home(){
  cnt("sN",docs.length);$("sL").textContent=docs[0]?fmt(docs[0].ts):"—";
  const q=$("q").value.trim();
  $("recent").style.display=docs.length&&!q?"block":"none";
  $("rlist").innerHTML=docs.slice(0,6).map(d=>`<button class="rc nolp" data-o="${d.id}"><i>${d.type==="pdf"?"📕":"🖼️"}</i><b>${esc(d.title)}</b><span>${esc(d.cat)}</span></button>`).join("");
  $("grid").innerHTML=CATS.map(([n,e],i)=>`<button class="cat nolp" style="--i:${i}" data-c="${n}"><span class="bd">${docs.filter(d=>d.cat===n).length}</span><div class="e">${e}</div><b>${n}</b><span class="sub">مستند</span></button>`).join("");
  $("grid").style.display=q?"none":"grid";$("res").style.display=q?"block":"none";
  if(q){const rows=docs.filter(d=>(d.title+" "+d.cat).includes(q));$("res").innerHTML=rows.length?rows.map(d=>docRow(d,1)).join(""):'<div class="empty">لا توجد نتائج</div>'}
  wire($("home"));
  $("grid").querySelectorAll(".cat").forEach(b=>lp(b,()=>menu(b),()=>openCat(b.dataset.c)));
}
$("q").oninput=home;
function openCat(c){closeMenu();cur=c;$("home").style.display="none";$("cv").style.display="block";$("ct").textContent=c;$("bh").classList.remove("on");renderList();clipUI();scrollTo(0,0)}
function goHome(){cur=null;$("cv").style.display="none";$("home").style.display="block";$("bh").classList.add("on");home();clipUI()}
function renderList(){
  if(!cur)return;const rows=docs.filter(d=>d.cat===cur);
  $("list").innerHTML=rows.length?rows.map(d=>docRow(d)).join(""):'<div class="empty">لا توجد مستندات هنا بعد.<br>اضغط ＋ لإضافة مستند، أو 📋 للصق.</div>';
  wire($("list"));
}
function refresh(){home();renderList()}

// ---------- scroll: hide banner while reading ----------
let ly=0;addEventListener("scroll",()=>{const y=scrollY;if(y>90&&y>ly+4)$("ban").classList.add("hid");else if(y<ly-4||y<=90)$("ban").classList.remove("hid");ly=y},{passive:true});

// ---------- long-press category menu ----------
function closeMenu(){const m=$("pm");if(m)m.remove();document.removeEventListener("pointerdown",outside,true)}
function outside(e){const m=$("pm");if(m&&!m.contains(e.target))closeMenu()}
function menu(b){
  closeMenu();const c=b.dataset.c,rows=docs.filter(d=>d.cat===c);
  const m=document.createElement("div");m.id="pm";
  m.innerHTML=`<div class="ph">${esc(c)}</div>`+(clip?`<button data-p="1">📋 لصق هنا</button>`:"")+(rows.length?rows.map(d=>`<button data-o="${d.id}">${d.type==="pdf"?"📕":"🖼️"} ${esc(d.title)}</button>`).join(""):'<div class="pe">لا توجد مستندات</div>');
  document.body.appendChild(m);
  const r=b.getBoundingClientRect(),mw=Math.min(300,innerWidth-24);m.style.width=mw+"px";
  const left=Math.min(Math.max(12,r.left+r.width/2-mw/2),innerWidth-mw-12);
  let top=r.bottom+6;if(top+m.offsetHeight>innerHeight-12)top=Math.max(12,r.top-m.offsetHeight-6);
  m.style.left=left+"px";m.style.top=top+"px";
  m.querySelectorAll("[data-o]").forEach(x=>x.onclick=()=>{closeMenu();view(x.dataset.o)});
  const p=m.querySelector("[data-p]");if(p)p.onclick=()=>{closeMenu();paste(c)};
  setTimeout(()=>document.addEventListener("pointerdown",outside,true),50);
}

// ---------- sheets ----------
function sheet(h){$("shc").innerHTML=h;$("sheet").classList.add("on")}
function closeSheet(){$("sheet").classList.remove("on")}
$("sheet").onclick=e=>{if(e.target.id==="sheet")closeSheet()};
const catSel=sel=>`<select id="ct2">${CATS.map(([n])=>`<option ${n===sel?"selected":""}>${n}</option>`).join("")}</select>`;
function addSheet(){
  sheet(`<h3>إضافة مستند</h3><p class="m">${cur?"سيُضاف إلى «"+esc(cur)+"»":"ستختار القسم بعد التصوير أو اختيار الملف"}${getKey()?" · القراءة الذكية مفعّلة":""}</p><div class="adds"><button class="add" id="s1"><i>📷</i>كاميرا</button><button class="add" id="s2"><i>🖼️</i>صورة</button><button class="add" id="s3"><i>📄</i>ملف</button></div>`);
  [["s1","icam"],["s2","ipho"],["s3","ifil"]].forEach(([b,i])=>$(b).onclick=()=>{closeSheet();$(i).click()});
}
["icam","ipho","ifil"].forEach(i=>$(i).onchange=()=>{queue=[...$(i).files];qTotal=queue.length;qDone=0;$(i).value="";nextFile()});
const isPdf=f=>f.type==="application/pdf"||/\.pdf$/i.test(f.name||"");

// ---------- smart reading (optional, needs your own API key) ----------
async function firstPageCanvas(blob,pdf,w){
  if(pdf){
    if(!window.pdfjsLib)throw new Error("pdf");
    const doc=await pdfjsLib.getDocument({data:await blob.arrayBuffer()}).promise,p=await doc.getPage(1),b=p.getViewport({scale:1}),vp=p.getViewport({scale:w/b.width});
    const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;await p.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;return c;
  }
  const bmp=await createImageBitmap(blob),m=w/bmp.width,c=document.createElement("canvas");c.width=w;c.height=Math.round(bmp.height*m);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);return c;
}
const PROMPT='اقرأ هذا المستند (الصفحة الأولى) وحدّد عنواناً مختصراً للملف وفق القواعد:\n- هوية شخصية: "هوية " + الاسم الكامل لصاحبها كما هو مكتوب.\n- جواز سفر: "جواز " + اسم صاحبه.\n- اتفاقية أو عقد (إيجار أو إدارة عقار أو غيرهما): "اتفاقية " + نوعها إن ظهر (مثل إدارة عقار) + أبرز مُعرِّف من: رقم الاتفاقية، أو اسم الطرف الآخر، أو اسم البناية أو العقار.\n- غير ذلك: عنوانه المكتوب أو وصف موجز.\nثم اختر القسم الأنسب حرفياً من: اتفاقيات، أعمالي، أوراق شخصية، فواتير، شهادات ورخص، أخرى.\nأعد JSON فقط بهذا الشكل دون أي نص آخر: {"title":"...","cat":"..."}';
async function smartRead(blob,pdf){
  const key=getKey();if(!key)return null;
  const c=await firstPageCanvas(blob,pdf,1400),b64=c.toDataURL("image/jpeg",.8).split(",")[1];
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:MODEL,max_tokens:300,messages:[{role:"user",content:[{type:"image",source:{type:"base64",media_type:"image/jpeg",data:b64}},{type:"text",text:PROMPT}]}]})});
  if(!r.ok)throw new Error("api "+r.status);
  const j=await r.json(),t=(j.content||[]).map(x=>x.text||"").join(""),m=t.match(/\{[\s\S]*\}/);if(!m)throw new Error("fmt");
  const o=JSON.parse(m[0]);return {title:String(o.title||"").trim(),cat:CATS.some(c=>c[0]===o.cat)?o.cat:null};
}

// ---------- adding ----------
async function nextFile(){
  const f=queue.shift();if(!f){closeSheet();if(qDone)toast("تم حفظ "+qDone+" مستند ✓");return}
  const pdf=isPdf(f),base=(f.name||"").replace(/\.[^.]+$/,"");
  let title=(!base||/^(image|img|photo|scan|pxl|\d)/i.test(base))?"مستند "+fmt(Date.now()):base,cat=cur||"أخرى",smart=false;
  if(getKey()){
    sheet('<h3>جارٍ قراءة المستند…</h3><p class="m">يقرأ Claude الصفحة الأولى ليحدد العنوان والقسم.</p>');
    try{const r=await smartRead(f,pdf);if(r&&r.title){title=r.title;smart=true;if(!cur&&r.cat)cat=r.cat}}catch(e){toast("تعذّرت القراءة الذكية، اكتب العنوان يدوياً")}
  }
  const total=qTotal>1?" ("+(qTotal-queue.length)+" من "+qTotal+")":"";
  sheet(`<h3>حفظ المستند${total}</h3>${smart?'<p class="m">✨ قُرئ العنوان تلقائياً، يمكنك تعديله</p>':""}<input id="ti" value="${esc(title)}" placeholder="عنوان المستند">${catSel(cat)}<div class="row2"><button class="btn" id="sv">حفظ</button><button class="btn s" id="sk">تخطي</button></div>`);
  $("sv").onclick=async()=>{
    try{await put({id:newId(),cat:$("ct2").value,title:$("ti").value.trim()||title,type:pdf?"pdf":"img",name:f.name||"",ts:Date.now()},f);qDone++;await load();refresh()}
    catch(e){toast("تعذّر الحفظ: المساحة ممتلئة؟")}
    nextFile();
  };
  $("sk").onclick=nextFile;
}

// ---------- document actions ----------
function actSheet(id,armDel){
  const d=docs.find(x=>x.id===id);if(!d)return;
  sheet(`<h3>${esc(d.title)}</h3><p class="m">${esc(d.cat)} · ${fmt(d.ts)}</p>
  <button class="act" data-a="pv"><i>👁</i>معاينة سريعة</button>
  <button class="act" data-a="op"><i>📖</i>فتح بملء الشاشة</button>
  <button class="act" data-a="sh"><i>📤</i>مشاركة (واتساب، بريد…)</button>
  <button class="act" data-a="cp"><i>📋</i>نسخ</button>
  <button class="act" data-a="ct"><i>✂️</i>قص (نقل إلى قسم آخر)</button>
  <button class="act" data-a="ed"><i>✏️</i>تعديل العنوان والقسم</button>
  ${getKey()?'<button class="act" data-a="ai"><i>✨</i>قراءة العنوان تلقائياً</button>':""}
  <button class="act d" data-a="dl"><i>🗑</i>${armDel?"اضغط للتأكيد: حذف نهائي":"حذف"}</button>`);
  $("shc").querySelectorAll("[data-a]").forEach(b=>b.onclick=async()=>{
    const a=b.dataset.a;
    if(a==="dl"){if(!armDel){actSheet(id,true);return}closeSheet();await remove(id);await load();refresh();toast("تم الحذف");return}
    closeSheet();
    if(a==="pv")preview(id);else if(a==="op")view(id);else if(a==="sh")share(d);
    else if(a==="cp"||a==="ct"){clip={id,mode:a==="cp"?"copy":"cut"};clipUI();toast(a==="cp"?"تم النسخ. افتح القسم المطلوب ثم اضغط لصق":"تم القص. افتح القسم المطلوب ثم اضغط لصق")}
    else if(a==="ed")editSheet(id);
    else if(a==="ai")aiRename(id);
  });
}
function editSheet(id){
  const d=docs.find(x=>x.id===id);if(!d)return;
  sheet(`<h3>تعديل المستند</h3><input id="ti" value="${esc(d.title)}">${catSel(d.cat)}<div class="row2"><button class="btn" id="sv">حفظ</button><button class="btn s" id="sk">إلغاء</button></div>`);
  $("sv").onclick=async()=>{d.title=$("ti").value.trim()||d.title;d.cat=$("ct2").value;await put(d);await load();refresh();closeSheet()};
  $("sk").onclick=closeSheet;
}
async function aiRename(id){
  const d=docs.find(x=>x.id===id);if(!d)return;toast("جارٍ قراءة المستند…");
  try{const r=await smartRead(await getBlob(id),d.type==="pdf");if(r&&r.title){d.title=r.title;if(r.cat)d.cat=r.cat;await put(d);await load();refresh();toast("العنوان: "+d.title)}}
  catch(e){toast("تعذّرت القراءة الذكية. تحقق من المفتاح والاتصال")}
}

// ---------- copy / paste ----------
function clipUI(){
  const d=clip&&docs.find(x=>x.id===clip.id);if(clip&&!d)clip=null;
  $("clip").style.display=clip?"flex":"none";
  if(clip){$("clt").textContent=(clip.mode==="cut"?"✂️ ":"📋 ")+d.title;$("clp").style.display=cur?"":"none";if(!cur)$("clt").textContent+=" — افتح قسماً أو اضغط مطولاً على بطاقة";}
}
async function paste(cat){
  const d=clip&&docs.find(x=>x.id===clip.id);if(!d){clip=null;clipUI();return}
  try{
    if(clip.mode==="cut"){d.cat=cat;await put(d);clip=null}
    else{const blob=await getBlob(d.id);await put({...d,id:newId(),cat,ts:Date.now(),title:d.cat===cat?d.title+" (نسخة)":d.title},blob)}
    await load();refresh();clipUI();toast("تم اللصق في «"+cat+"» ✓");
  }catch(e){toast("تعذّر اللصق")}
}
async function pasteSystem(){
  try{
    const items=await navigator.clipboard.read(),fs=[];
    for(const it of items)for(const t of it.types)if(t.startsWith("image/")||t==="application/pdf")fs.push(new File([await it.getType(t)],"",{type:t}));
    if(fs.length){queue=fs;qTotal=fs.length;qDone=0;nextFile();return}
  }catch(e){}
  toast("لا يوجد مستند منسوخ. انسخ مستنداً من التطبيق أو صورة من جوالك");
}
$("clp").onclick=()=>cur&&paste(cur);$("clx").onclick=()=>{clip=null;clipUI()};
$("pst").onclick=()=>{if(clip&&cur)paste(cur);else pasteSystem()};
document.addEventListener("paste",e=>{if(!cur)return;const fs=[...(e.clipboardData?e.clipboardData.files:[])];if(fs.length){queue=fs;qTotal=fs.length;qDone=0;nextFile()}});

// ---------- quick preview (long press) ----------
const thumbs=new Map();
async function preview(id){
  const d=docs.find(x=>x.id===id);if(!d)return;
  $("pv").innerHTML=`<div class="pvc"><div class="pvt">${esc(d.title)}</div><div class="pvb" id="pvb"><span class="m">جارٍ التحميل…</span></div><div class="pvf"><button class="btn" id="pvo">فتح</button><button class="btn s" id="pvx">إغلاق</button></div></div>`;
  $("pv").classList.add("on");
  $("pvx").onclick=closePv;$("pvo").onclick=()=>{closePv();view(id)};
  $("pv").onclick=e=>{if(e.target.id==="pv")closePv()};
  try{
    if(!thumbs.has(id)){const c=await firstPageCanvas(await getBlob(id),d.type==="pdf",600);thumbs.set(id,c.toDataURL("image/jpeg",.75))}
    const im=new Image();im.src=thumbs.get(id);$("pvb").innerHTML="";$("pvb").appendChild(im);
  }catch(e){$("pvb").innerHTML='<span class="m" style="padding:20px">تعذّرت المعاينة. افتح المستند بدلاً منها.</span>'}
}
function closePv(){$("pv").classList.remove("on");$("pv").innerHTML=""}

// ---------- full-screen viewer (swipe pages, hold-and-drag to close) ----------
let vtok=0;
async function view(id){
  const d=docs.find(x=>x.id===id);if(!d)return;curDoc=d;const tok=++vtok;
  const vp=$("vp");vp.innerHTML="";vp.style.transform="";$("v").style.background="";$("vt").textContent=d.title;$("v").style.display="block";$("vh").classList.remove("hid");document.body.style.overflow="hidden";$("vi").textContent="";
  const blob=await getBlob(id);
  if(d.type!=="pdf"){const s=mkSlide();const im=new Image();im.src=URL.createObjectURL(blob);s.appendChild(im);vp.appendChild(s);return}
  if(!window.pdfjsLib){const s=mkSlide();s.innerHTML='<p class="ph0">يحتاج عرض ملفات PDF إلى اتصال بالإنترنت مرة واحدة.</p>';vp.appendChild(s);return}
  try{
    const pdf=await pdfjsLib.getDocument({data:await blob.arrayBuffer()}).promise,dpr=Math.min(devicePixelRatio||1,2),W=vp.clientWidth||360,slides=[];
    for(let n=1;n<=pdf.numPages;n++){const s=mkSlide();s.innerHTML='<p class="ph0">…</p>';vp.appendChild(s);slides.push(s)}
    setIdx();
    for(let n=1;n<=pdf.numPages;n++){
      if(tok!==vtok)return;
      const p=await pdf.getPage(n),b=p.getViewport({scale:1}),v2=p.getViewport({scale:W/b.width*dpr});
      const c=document.createElement("canvas");c.width=v2.width;c.height=v2.height;
      await p.render({canvasContext:c.getContext("2d"),viewport:v2}).promise;
      slides[n-1].innerHTML="";slides[n-1].appendChild(c);
    }
  }catch(e){const s=mkSlide();s.innerHTML='<p class="ph0">تعذّر عرض الملف.</p>';vp.innerHTML="";vp.appendChild(s)}
}
function mkSlide(){
  const s=document.createElement("div");s.className="sl";let last=0;
  s.addEventListener("scroll",()=>{const y=s.scrollTop;if(y>last+6&&y>40)$("vh").classList.add("hid");else if(y<last-6)$("vh").classList.remove("hid");last=y},{passive:true});
  s.addEventListener("click",()=>$("vh").classList.toggle("hid"));
  return s;
}
function setIdx(){const vp=$("vp"),n=vp.children.length;$("vi").textContent=n>1?(Math.round(vp.scrollLeft/(vp.clientWidth||1))+1)+" / "+n:""}
$("vp").addEventListener("scroll",setIdx,{passive:true});
function closeV(){vtok++;const v=$("v");v.style.display="none";$("vp").innerHTML="";$("vp").style.transform="";v.style.background="";document.body.style.overflow="";$("vlift").style.display="none"}
$("vc").onclick=closeV;$("vsh").onclick=()=>share(curDoc);
// hold ~0.4s then drag up/down and release to close; normal swipes only scroll/change pages
let ht=null,drag=false,hy=0,hx=0;const V=$("v");
V.addEventListener("touchstart",e=>{if(e.touches.length>1||e.target.closest("#vh"))return;hy=e.touches[0].clientY;hx=e.touches[0].clientX;drag=false;clearTimeout(ht);ht=setTimeout(()=>{drag=true;vib();$("vp").classList.add("nt");$("vlift").style.display="block"},400)},{passive:true});
V.addEventListener("touchmove",e=>{
  const dy=e.touches[0].clientY-hy,dx=e.touches[0].clientX-hx;
  if(!drag){if(Math.abs(dy)>10||Math.abs(dx)>10)clearTimeout(ht);return}
  e.preventDefault();const a=Math.min(Math.abs(dy),320);
  $("vp").style.transform=`translateY(${dy}px) scale(${1-a/1400})`;V.style.background=`rgba(4,7,13,${1-a/450})`;
},{passive:false});
function endDrag(e){
  clearTimeout(ht);if(!drag)return;drag=false;$("vp").classList.remove("nt");$("vlift").style.display="none";
  const dy=(e.changedTouches?e.changedTouches[0].clientY:hy)-hy;
  if(Math.abs(dy)>130)closeV();else{$("vp").style.transform="";V.style.background=""}
}
V.addEventListener("touchend",endDrag);V.addEventListener("touchcancel",endDrag);

// ---------- share ----------
async function share(d){
  if(!d)return;
  try{
    const b=await getBlob(d.id),ext=d.type==="pdf"?"pdf":((b.type.split("/")[1]||"jpg").replace("jpeg","jpg"));
    const f=new File([b],(d.title.replace(/[\\/:*?"<>|]/g,"")||"مستند")+"."+ext,{type:b.type||(d.type==="pdf"?"application/pdf":"image/jpeg")});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:d.title});return}
    const u=URL.createObjectURL(f),a=document.createElement("a");a.href=u;a.download=f.name;a.click();toast("تم تنزيل الملف");
  }catch(e){if(!e||e.name!=="AbortError")toast("تعذّرت المشاركة")}
}

  $("ks").onclick=()=>{try{const v=$("ky").value.trim();if(v)localStorage.setItem("awraqi_key",v);else localStorage.removeItem("awraqi_key")}catch(e){}closeSheet();toast(getKey()?"تم تفعيل القراءة الذكية ✓":"تم حذف المفتاح")};
  $("kd").onclick=()=>{try{localStorage.removeItem("awraqi_key")}catch(e){}closeSheet();toast("تم حذف المفتاح")};

$("back").onclick=goHome;

  home();
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
